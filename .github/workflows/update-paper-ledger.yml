name: Update forward paper validation

on:
  schedule:
    - cron: "20 7 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-paper-ledger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Record the next-bar paper portfolio
        shell: python
        run: |
          import json
          import pathlib
          import urllib.parse
          import urllib.request
          from datetime import datetime, timezone, timedelta

          ASSETS = [
              ("600276", "恒瑞医药"),
              ("603259", "药明康德"),
              ("159748", "创新药ETF富国"),
          ]
          FAST, SLOW, FRICTION = 10, 30, 0.0012
          CST = timezone(timedelta(hours=8))

          def secid(code):
              return ("1." if code[0] in "569" else "0.") + code

          def fetch_daily(code):
              query = urllib.parse.urlencode({
                  "secid": secid(code),
                  "klt": "101",
                  "fqt": "1",
                  "lmt": "120",
                  "end": "20500101",
                  "fields1": "f1,f2,f3,f4,f5,f6",
                  "fields2": "f51,f52,f53,f54,f55,f56,f57,f58,f59,f60,f61",
              })
              request = urllib.request.Request(
                  "https://push2his.eastmoney.com/api/qt/stock/kline/get?" + query,
                  headers={
                      "User-Agent": "Mozilla/5.0",
                      "Referer": "https://quote.eastmoney.com/",
                  },
              )
              with urllib.request.urlopen(request, timeout=25) as response:
                  payload = json.load(response)
              rows = []
              for line in (payload.get("data") or {}).get("klines") or []:
                  values = line.split(",")
                  rows.append({
                      "date": values[0],
                      "open": float(values[1]),
                      "close": float(values[2]),
                  })
              if len(rows) < SLOW + 2:
                  raise RuntimeError(f"{code} history is too short")
              return rows

          def sma(rows, end, size):
              values = [row["close"] for row in rows[end-size+1:end+1]]
              return sum(values) / len(values)

          def signal(rows, end):
              return int(
                  rows[end]["close"] > sma(rows, end, SLOW)
                  and sma(rows, end, FAST) > sma(rows, end, SLOW)
              )

          target = pathlib.Path("site/paper-ledger.json")
          if not target.parent.exists():
              target = pathlib.Path("paper-ledger.json")
          ledger = (
              json.loads(target.read_text("utf-8"))
              if target.exists()
              else {"entries": [], "state": {}}
          )
          series = {code: fetch_daily(code) for code, _ in ASSETS}
          latest_date = min(rows[-1]["date"] for rows in series.values())
          if any(row.get("date") == latest_date for row in ledger.get("entries", [])):
              print(f"Paper ledger already contains {latest_date}")
              raise SystemExit(0)

          states = ledger.get("state") or {}
          asset_rows = []
          for code, name in ASSETS:
              rows = series[code]
              index = max(i for i, row in enumerate(rows) if row["date"] == latest_date)
              current, prior = rows[index], rows[index - 1]
              desired = signal(rows, index - 1)
              state = states.get(code) or {
                  "cash": 1.0,
                  "shares": 0.0,
                  "position": 0,
              }
              action = "持有" if state["position"] else "空仓"
              blocked = False
              gap = current["open"] / prior["close"] - 1
              if desired > state["position"]:
                  if gap >= 0.095:
                      blocked = True
                      action = "涨停附近未模拟成交"
                  else:
                      state["shares"] = state["cash"] * (1 - FRICTION) / current["open"]
                      state["cash"] = 0.0
                      state["position"] = 1
                      action = "下一日开盘模拟买入"
              elif desired < state["position"]:
                  if gap <= -0.095:
                      blocked = True
                      action = "跌停附近未模拟成交"
                  else:
                      state["cash"] = state["shares"] * current["open"] * (1 - FRICTION)
                      state["shares"] = 0.0
                      state["position"] = 0
                      action = "下一日开盘模拟卖出"
              equity = state["cash"] + state["shares"] * current["close"]
              states[code] = state
              asset_rows.append({
                  "code": code,
                  "name": name,
                  "open": round(current["open"], 4),
                  "close": round(current["close"], 4),
                  "executedSignal": desired,
                  "nextSignal": signal(rows, index),
                  "action": action,
                  "blocked": blocked,
                  "equity": round(equity, 8),
              })

          equity = sum(row["equity"] for row in asset_rows) / len(asset_rows)
          previous = (ledger.get("entries") or [{}])[-1].get("equity", 1.0)
          entry = {
              "date": latest_date,
              "equity": round(equity, 8),
              "dailyReturn": round(equity / previous - 1, 8) if previous else 0,
              "assets": asset_rows,
          }
          entries = (ledger.get("entries") or []) + [entry]
          result = {
              "ok": True,
              "source": "GitHub同域前向模拟盘镜像 · 东方财富前复权日线",
              "startedAt": ledger.get("startedAt") or latest_date,
              "updatedAt": datetime.now(CST).isoformat(),
              "days": len(entries),
              "method": (
                  f"MA{FAST}/MA{SLOW}趋势规则；收盘形成信号，"
                  f"下一交易日开盘模拟执行；单边摩擦{FRICTION:.2%}"
              ),
              "entries": entries[-260:],
              "state": states,
          }
          target.write_text(
              json.dumps(result, ensure_ascii=False, indent=2) + "\n",
              "utf-8",
          )
          print(f"Recorded {latest_date}; paper equity={equity:.6f}")
      - name: Commit paper ledger when a new trading day is recorded
        run: |
          git config user.name "redflare-paper-bot"
          git config user.email "actions@users.noreply.github.com"
          if [ -f site/paper-ledger.json ]; then git add site/paper-ledger.json; else git add paper-ledger.json; fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "update forward paper validation"
          git push
